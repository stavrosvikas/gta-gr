<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GTA GR 3D test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; touch-action: none; user-select: none;
    background: linear-gradient(180deg, #7fc4dc 0%, #b9b0ea 40%, #f0a8c4 72%, #fbe2bf 100%); }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #hud { position: fixed; left: 12px; top: 10px; color: #fff; font: 800 14px system-ui; text-shadow: 0 2px 0 #2a2440; }
  .bub { position: fixed; transform: translate(-50%, -100%); background: #fff; color: #1a1020; font: 900 18px system-ui; padding: 6px 12px;
    border-radius: 16px; border: 3px solid #1a1020; white-space: nowrap; pointer-events: none; }
  #joy { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(42,36,64,.35); display: none; }
  #joy i { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.8); }
  #act { position: fixed; right: 24px; bottom: 34px; width: 84px; height: 84px; border-radius: 50%; border: 0; background: #ff5fa2; color: #fff; font: 900 18px system-ui; display: none; }
  #help { position: fixed; right: 12px; top: 10px; color: #fff; font: 700 12px system-ui; text-shadow: 0 1px 0 #2a2440; text-align: right; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="help">WASD / βελάκια: κίνηση · Shift: τρέξιμο · E: μπες/βγες από αμάξι</div>
<div id="joy"><i></i></div><button id="act">E</button>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.31.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.31.0/babylonjs.loaders.min.js"></script>
<script src="js/game3d.js?v=2"></script>
</body>
</html>
